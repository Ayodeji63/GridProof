name: GridProof CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gridproof-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, build, and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @gridproof/e2e exec playwright install --with-deps chromium

      - name: Run monorepo tests
        run: pnpm test

      - name: Run lint and TypeScript checks
        run: pnpm lint

      - name: Build all packages and apps
        run: pnpm build

      - name: Install Foundry contract dependencies
        run: pnpm contracts:install

      - name: Run Foundry contract tests
        run: pnpm foundry:test
