services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gridproof
      POSTGRES_USER: gridproof
      POSTGRES_PASSWORD: gridproof
    ports:
      - "5432:5432"
    volumes:
      - gridproof_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridproof -d gridproof"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gridproof_postgres:
